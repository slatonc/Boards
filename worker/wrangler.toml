name = "fortheboards-fulfillment"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Retained for migration of old fulfillment and shipping-notification records.
# Sandbox/dev uses its own namespace so test orders never collide with real ones.
[[kv_namespaces]]
binding = "FULFILLMENT"
id = "2e079500ea2e4431bcbe303214ecda67"
preview_id = "8ab0b23b01de448091554cd8ac2db6b2"

[[durable_objects.bindings]]
name = "ORDERS"
class_name = "OrderFulfillment"

[[migrations]]
tag = "v1-order-fulfillment"
new_sqlite_classes = ["OrderFulfillment"]

# Non-secret config. Secrets are set separately — see README.
[vars]
LULU_API_BASE = "https://api.sandbox.lulu.com"
BOOK_TITLE = "For The Boards"
LULU_CONTACT_EMAIL = "slaton@fortheboards.com"
ALLOWED_PAYMENT_LINK_URL = "REPLACE_WITH_SANDBOX_PAYMENT_LINK_URL"

# The Lulu SKU encoding trim size, color, binding, and paper. Decoded from the
# ForTheBoards project: US Letter 8.5x11, color, perfect bound paperback,
# 60# uncoated white, matte cover. 246 pages.
# Verify with: node find-sku.mjs --trim 8.5x11 --color FC --bind PB \
#   --paper 060UW444 --finish MXX --pages 246 --live
POD_PACKAGE_ID = "0850X1100FCSTDPB060UW444MXX"

# Sandbox is a separate Lulu account with its own credentials and its own
# printables, so it needs its own id minted there before this env can fulfill:
#   node mint-printable.mjs --interior <url> --cover <url>
# Alternatively set INTERIOR_PDF_URL and COVER_PDF_URL to normalize on the fly.
# LULU_PRINTABLE_ID = "..."

# MAIL | PRIORITY_MAIL | GROUND_HD | GROUND_BUS | GROUND | EXPEDITED | EXPRESS
SHIPPING_LEVEL = "MAIL"

# Minutes before the job enters production (60–2880). This is your window to
# cancel a fraudulent or mistaken order before it costs you a printed book.
PRODUCTION_DELAY = "120"

# Used only if Stripe didn't capture a phone number.
FALLBACK_PHONE = "773-543-0603"

# Sender for shipping notifications. This address must be verified in Brevo,
# or every send is rejected.
EMAIL_FROM = "slaton@fortheboards.com"
EMAIL_FROM_NAME = "For The Boards"

# Blind-copied on every shipping email, so you see exactly what buyers get.
# Remove this line to stop the copies.
EMAIL_BCC = "slaton@fortheboards.com"

[env.production]
name = "fortheboards-fulfillment-prod"
# The stable workers.dev URL is what Stripe posts to. Per-version preview URLs
# are off — no reason to expose extra public endpoints on a payment webhook.
workers_dev = true
preview_urls = false

[[env.production.durable_objects.bindings]]
name = "ORDERS"
class_name = "OrderFulfillment"

[env.production.vars]
LULU_API_BASE = "https://api.lulu.com"
BOOK_TITLE = "For The Boards"
LULU_CONTACT_EMAIL = "slaton@fortheboards.com"
ALLOWED_PAYMENT_LINK_URL = "https://buy.stripe.com/4gM5kFc7m2CO8dz76cbAs00"
ALERT_EMAIL = "slaton@fortheboards.com"
POD_PACKAGE_ID = "0850X1100FCSTDPB060UW444MXX"

# Lulu holds the normalized 246-page files under this id, so no PDF URLs
# are needed and nothing has to stay hosted. Minted with mint-printable.mjs
# from 2mr7zqm_13_print_{interior,cover}.pdf. For a new edition: mint a
# fresh id and replace this.
LULU_PRINTABLE_ID = "7c55e2a9-383e-4e00-b3da-1cfecfdcfe70"

SHIPPING_LEVEL = "MAIL"
PRODUCTION_DELAY = "120"
FALLBACK_PHONE = "773-543-0603"
EMAIL_FROM = "slaton@fortheboards.com"
EMAIL_FROM_NAME = "For The Boards"

# Blind-copied on every shipping email, so you see exactly what buyers get.
# Remove this line to stop the copies.
EMAIL_BCC = "slaton@fortheboards.com"

[[env.production.kv_namespaces]]
binding = "FULFILLMENT"
id = "3350c262a8ad44b6aa0bb9b419563d40"
