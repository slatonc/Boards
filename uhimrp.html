<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UHIMRP Residency Program ABIM Document - For The Boards">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <title>UHIMRP - For The Boards</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <style>
        .uhimrp-container {
            min-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg) var(--space-md);
        }

        .verification-card {
            background: white;
            border-radius: 12px;
            padding: var(--space-lg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .verification-card h2 {
            color: var(--primary-700);
            margin-bottom: var(--space-sm);
        }

        .verification-card p {
            color: var(--neutral-700);
            margin-bottom: var(--space-md);
        }

        .verification-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .verification-form input {
            padding: var(--space-sm);
            font-size: var(--body-size);
            border: 2px solid var(--neutral-300);
            border-radius: 8px;
            font-family: var(--font-primary);
            transition: border-color 0.3s ease;
        }

        .verification-form input:focus {
            outline: none;
            border-color: var(--primary-500);
        }

        .verification-form button {
            padding: var(--space-sm) var(--space-md);
            font-size: var(--body-size);
            font-weight: 600;
            background-color: var(--primary-500);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-family: var(--font-primary);
        }

        .verification-form button:hover {
            background-color: var(--primary-700);
            transform: translateY(-2px);
        }

        .verification-form button:active {
            transform: translateY(0);
        }

        .error-message {
            color: var(--accent-500);
            font-size: 0.9rem;
            margin-top: var(--space-xs);
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .document-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-md);
        }

        .document-container.show {
            display: block;
        }

        .document-header {
            text-align: center;
            margin-bottom: var(--space-md);
        }

        .document-header h2 {
            color: var(--primary-700);
            margin-bottom: var(--space-xs);
        }

        .document-header p {
            color: var(--neutral-700);
            margin-bottom: 0;
        }

        .document-wrapper {
            background: white;
            border-radius: 12px;
            padding: var(--space-sm);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .document-wrapper iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 8px;
        }

        .logout-button {
            display: inline-block;
            margin-top: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            font-size: 0.9rem;
            font-weight: 600;
            background-color: var(--neutral-500);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-family: var(--font-primary);
            text-decoration: none;
        }

        .logout-button:hover {
            background-color: var(--neutral-700);
        }

        @media (max-width: 768px) {
            .document-wrapper iframe {
                height: 600px;
            }
        }
    </style>
</head>

<body>
    <div class="uhimrp-container">
        <!-- Verification Card -->
        <div id="verificationCard" class="verification-card">
            <h2>UHIMRP ABIM Document Access</h2>
            <p>This document is restricted to UHIMRP residents and faculty. Please enter the access password to continue.</p>

            <form class="verification-form" id="verificationForm">
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter password"
                    required
                    autocomplete="off"
                >
                <div class="error-message" id="errorMessage">
                    Incorrect password. Please try again.
                </div>
                <button type="submit">Access Document</button>
            </form>
        </div>

        <!-- Document Container (hidden by default) -->
        <div id="documentContainer" class="document-container">
            <div class="document-wrapper">
                <iframe src="https://docs.google.com/document/d/1cXhnALhP2k0hyx0PLK90-D_sYZwXONRK0_bwZH37Tts/edit?usp=sharing"></iframe>
            </div>
            <div style="text-align: center;">
                <button class="logout-button" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Set your password here
        const ACCESS_PASSWORD = 'UHIMRP2025';

        // Check if user is already verified
        window.addEventListener('DOMContentLoaded', function() {
            const isVerified = sessionStorage.getItem('uhimrp_verified');
            if (isVerified === 'true') {
                showDocument();
            }
        });

        // Handle form submission
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const passwordInput = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');
            const password = passwordInput.value;

            // Validate password
            if (password === ACCESS_PASSWORD) {
                // Store verification in session storage
                sessionStorage.setItem('uhimrp_verified', 'true');
                errorMessage.classList.remove('show');
                showDocument();
            } else {
                // Show error message
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        function showDocument() {
            document.getElementById('verificationCard').style.display = 'none';
            document.getElementById('documentContainer').classList.add('show');
        }

        function logout() {
            sessionStorage.removeItem('uhimrp_verified');
            document.getElementById('verificationCard').style.display = 'block';
            document.getElementById('documentContainer').classList.remove('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').classList.remove('show');
        }
    </script>
</body>
</html>
